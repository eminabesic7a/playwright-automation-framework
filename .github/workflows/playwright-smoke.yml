
name: Nightly Smoke Tests

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: 'Europe/Sarajevo'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        run: npx playwright test --grep "@smoke" --project=chromium --reporter=list,html,json

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-smoke-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JSON results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: test-results/results.json
          if-no-files-found: warn
          retention-days: 30

  create-issues:
    if: ${{ always() && needs.smoke.result == 'failure' }}
    needs: smoke
    runs-on: ubuntu-latest

    steps:
      - name: Download JSON results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-test-results
          path: artifacts

      - name: Create or update an Issue for each failed test
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const { owner, repo } = context.repo;
            const labelName = 'automation-failure';
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const resultsPath = path.join('artifacts', 'results.json');

            if (!fs.existsSync(resultsPath)) {
              throw new Error(
                'Playwright JSON report is missing. Check the failed workflow run and its artifacts.'
              );
            }

            const report = JSON.parse(
              fs.readFileSync(resultsPath, 'utf8')
            );

            function extractFailures(suite, parents = []) {
              const failures = [];
              const titles = suite.title
                ? [...parents, suite.title]
                : parents;

              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const result of test.results || []) {
                    if (
                      !['failed', 'timedOut', 'interrupted'].includes(
                        result.status
                      ) && !result.error
                    ) {
                      continue;
                    }

                    failures.push({
                      title: [...titles, spec.title]
                        .filter(Boolean)
                        .join(' › '),
                      status: result.status || 'failed',
                      message: result.error?.message ||
                        'No error message available.',
                      stack: result.error?.stack || ''
                    });
                  }
                }
              }

              for (const child of suite.suites || []) {
                failures.push(...extractFailures(child, titles));
              }

              return failures;
            }

            const failures = (report.suites || [])
              .flatMap(suite => extractFailures(suite));

            if (failures.length === 0) {
              throw new Error(
                'The workflow failed, but no failed tests were found in the JSON report.'
              );
            }

            const { data: allIssues } =
              await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: labelName,
                per_page: 100
              });

            let labelExists = true;

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName
              });
            } catch (error) {
              if (error.status === 404) {
                labelExists = false;
              } else {
                throw error;
              }
            }

            if (!labelExists) {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: 'd73a4a',
                description: 'Automatically reported smoke test failures'
              });
            }

            for (const failure of failures) {
              const testKey = crypto
                .createHash('sha256')
                .update(failure.title)
                .digest('hex')
                .slice(0, 16);

              const marker = `<!-- playwright-test:${testKey} -->`;

              const existingIssue = allIssues.find(issue =>
                issue.body?.includes(marker)
              );

              const errorText = [
                failure.message,
                failure.stack ? `\n${failure.stack}` : ''
              ].join('').slice(0, 5000);

              const body = [
                marker,
                '# Playwright Smoke Test Failure',
                '',
                '> An automated test failed. This does not necessarily mean the application has a bug.',
                '',
                '## Run details',
                '',
                `- **Failed test:** ${failure.title}`,
                `- **Result:** ${failure.status}`,
                '- **Browser:** Chromium',
                `- **Branch:** \`${context.ref}\``,
                `- **Commit:** [\`${context.sha.slice(0, 7)}\`](${context.serverUrl}/${owner}/${repo}/commit/${context.sha})`,
                `- **Workflow run:** [Open run and reports](${runUrl})`,
                '',
                '## Error details',
                '',
                '<details>',
                '<summary>View error message and stack trace</summary>',
                '',
                '```text',
                errorText,
                '```',
                '',
                '</details>',
                '',
                '## Investigation checklist',
                '',
                '- [ ] Review expected vs. actual result.',
                '- [ ] Inspect the stack trace, screenshot, and trace if available.',
                '- [ ] Determine whether this is an application defect, test issue, or environment failure.',
                '- [ ] Record the root cause and verify the fix.',
                '',
                '## Automation notes',
                '',
                '- Reported automatically by GitHub Actions.',
                '- No application or test code was automatically modified.'
              ].join('\n');

              if (existingIssue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  body: [
                    '## The same test failed again',
                    '',
                    `**Latest run:** [Open workflow run](${runUrl})`,
                    '',
                    `**Result:** ${failure.status}`,
                    '',
                    '<details>',
                    '<summary>View latest error</summary>',
                    '',
                    '```text',
                    errorText,
                    '```',
                    '',
                    '</details>'
                  ].join('\n')
                });

                core.info(
                  `Updated Issue #${existingIssue.number} for: ${failure.title}`
                );
              } else {
                const issue = await github.rest.issues.create({
                  owner,
                  repo,
                  title: `Playwright failure: ${failure.title}`,
                  body,
                  labels: [labelName]
                });

                allIssues.push(issue.data);

                core.info(
                  `Created Issue #${issue.data.number} for: ${failure.title}`
                );
              }
            }
